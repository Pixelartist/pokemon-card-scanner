# Portainer stack (Deploy → Stacks → Create stack → "Dockerfile / docker-compose.yml")

version: "3.9"

services:
  scanner:
    image: ghcr.io/pixelartist/pokemon-card-scanner:latest
    container_name: pokemon-card-scanner
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      # Required: your PTCG API key (card data source). Supply it from the
      # Portainer stack environment / an .env file next to this compose file;
      # never commit the real value.
      - PTCG_API_KEY=${PTCG_API_KEY:?set PTCG_API_KEY in the stack environment}
      # Background identification: the vision model reads cards OCR cannot.
      # Values come from the .env next to this file; leave the key unset to run
      # with OCR only.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - IDENTIFY_LLM_BASE=${IDENTIFY_LLM_BASE:-https://api.openai.com/v1}
      - IDENTIFY_LLM_MODEL=${IDENTIFY_LLM_MODEL:-auto}
      - IDENTIFY_LLM_TIMEOUT=${IDENTIFY_LLM_TIMEOUT:-90}
      # Optional overrides
      - HOST=0.0.0.0
      - PORT=5005
    volumes:
      # Persistent data: SQLite DB, card images, CLIP index, scan uploads
      - /opt/data/pokemon-card-scanner/data:/opt/data/pokemon-card-scanner/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s