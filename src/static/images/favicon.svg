<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pokémon Card Scanner">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162034"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCB05" stop-opacity="0"/>
      <stop offset="16%" stop-color="#FFCB05" stop-opacity="1"/>
      <stop offset="84%" stop-color="#FFCB05" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFCB05" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Indigo tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)" stroke="#243149" stroke-width="2"/>

  <!-- Card being scanned -->
  <rect x="19.5" y="13" width="25" height="38" rx="4" fill="#0b1120" stroke="#FFCB05" stroke-width="3"/>
  <rect x="24.5" y="18.5" width="15" height="9" rx="1.5" fill="#FFCB05" fill-opacity="0.22"/>

  <!-- Scan beam -->
  <rect x="9" y="30.6" width="46" height="3.4" rx="1.7" fill="url(#beam)"/>
  <rect x="14" y="31.85" width="36" height="0.9" rx="0.45" fill="#FFF3C4" fill-opacity="0.95"/>
</svg>
