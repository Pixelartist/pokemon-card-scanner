<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16213e">
<title>Local Scanner — Pokémon Cards</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-2: #161b22;
    --card: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #f78166;
    --green: #3fb950;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }

  .stage {
    width: 100%; max-width: 480px; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; position: relative;
  }
  #camera { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #000; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; pointer-events: none;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
  }
  .topbar button {
    background: rgba(255,255,255,0.12); color: var(--text); border: none;
    border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; cursor: pointer;
  }
  .topbar button:hover { background: rgba(255,255,255,0.2); }
  .frame {
    border: 2px solid rgba(88,166,255,0.6); border-radius: 14px;
    margin: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.55);
  }
  .status {
    text-align: center; padding: 10px 12px; font-size: 0.8rem;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
  }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; background: var(--muted); }
  .status .dot.on { background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .controls { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 14px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: filter 0.15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.ghost { background: var(--card); border: 1px solid var(--border); }
  .btn.ghost:hover { background: #2d333b; }

  .progress {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    margin-top: 12px; display: none;
  }
  .progress > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
  .progress.show { display: block; }

  .results { margin-top: 20px; width: 100%; max-width: 480px; }
  .results h2 { font-size: 1rem; margin-bottom: 10px; color: var(--muted); }
  .match {
    display: flex; align-items: center; gap: 12px; padding: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
  }
  .match:hover { border-color: var(--accent); }
  .match img { width: 48px; height: 68px; object-fit: contain; border-radius: 6px; background: var(--bg-2); }
  .match .info { flex: 1; min-width: 0; }
  .match .name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match .meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .match .score { font-size: 0.8rem; color: var(--accent); font-weight: 600; }
  .match .score.silver { color: #c0c0c0; }
  .match .score.bronze { color: #cd7f32; }
  .empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 0; }
  .err { color: var(--accent-2); font-size: 0.8rem; text-align: center; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Local Scanner</h1>
  <p class="subtitle">Runs entirely in your browser — no server, no upload</p>

  <div class="stage">
    <video id="camera" autoplay playsinline muted></video>
    <div class="overlay">
      <div class="topbar">
        <button id="flip-btn">↻ Flip</button>
        <button id="upload-btn">📷 Upload</button>
      </div>
      <div class="frame"></div>
      <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">Initialising…</span></div>
    </div>
  </div>

  <div class="progress" id="progress"><div></div></div>

  <div class="controls">
    <button class="btn" id="capture-btn" disabled>Capture</button>
  </div>

  <div class="results">
    <h2 id="results-title">Top matches</h2>
    <div id="results-list"></div>
  </div>

  <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
// page lives under /scanner/, so default local model path 404s — load from HF CDN
env.allowLocalModels = false;

const $ = id => document.getElementById(id);
const statusDot = $('status-dot'), statusText = $('status-text');
const resultsList = $('results-list'), resultsTitle = $('results-title');
const captureBtn = $('capture-btn'), progressEl = $('progress');
const progressBar = progressEl.firstElementChild;

let video = $('camera'), stream = null, facing = 'environment';
let model = null, index = null, cardIds = [], meta = [];
let busy = false;

function setStatus(text, on) {
  statusText.textContent = text;
  statusDot.className = 'dot' + (on ? ' on' : '');
}

async function loadIndex() {
  setStatus('Loading card index…');
  const [ids, m] = await Promise.all([
    fetch('card-ids.json').then(r => r.json()),
    fetch('cards_meta.json').then(r => r.json()),
  ]);
  cardIds = ids; meta = m;
  const buf = await (await fetch('card-index.bin')).arrayBuffer();
  const bytes = new Int8Array(buf);
  index = new Array(cardIds.length);
  for (let i = 0; i < cardIds.length; i++) {
    index[i] = bytes.subarray(i * 512, (i + 1) * 512);
  }
}

async function loadModel() {
  setStatus('Loading recognition model…');
  progressEl.classList.add('show');
  model = await pipeline('image-feature-extraction', 'Xenova/clip-vit-base-patch32', {
    progress_callback: p => {
      if (p.status === 'progress') progressBar.style.width = Math.round(p.progress) + '%';
    },
  });
  window.__model = model;
  window.__embed = embed;
  window.__match = match;
  progressEl.classList.remove('show');
}

function cosineInt8(query, ref) {
  let dot = 0;
  for (let i = 0; i < 512; i++) dot += query[i] * ref[i];
  return dot / (127.0 * 127.0);  // both sides quantised x127
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function embed(source) {
  // transformers.js accepts URL strings and base64 data URLs (not raw byte arrays in browsers)
  const input = typeof source === 'string' ? source : await blobToDataURL(source);
  const out = await model(input);
  let arr = Array.from(out.data);
  const n = Math.sqrt(arr.reduce((s, v) => s + v * v, 0)) + 1e-9;
  const q = new Int8Array(512);
  for (let i = 0; i < 512; i++) {
    let v = Math.round(arr[i] / n * 127.0);
    v = Math.max(-127, Math.min(127, v));
    q[i] = v;
  }
  return q;
}

async function match(image) {
  if (!model || !index) return null;
  const q = await embed(image);
  const scores = [];
  for (let i = 0; i < index.length; i++) {
    scores.push({ i, s: cosineInt8(q, index[i]) });
  }
  scores.sort((a, b) => b.s - a.s);
  return scores.slice(0, 5);
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 800 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    setStatus('Ready', true);
    captureBtn.disabled = false;
  } catch (e) {
    setStatus('Camera error: ' + e.message, false);
  }
}

async function flip() {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) stream.getTracks().forEach(t => t.stop());
  await startCamera();
}

function dataURLtoBlob(url) {
  const [head, body] = url.split(',');
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(body);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function capture() {
  if (busy) return;
  busy = true;
  captureBtn.disabled = true;
  resultsList.innerHTML = '<div class="empty">Matching…</div>';
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 800;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
  await runMatch(blob);
  busy = false;
  captureBtn.disabled = false;
}

async function runMatch(fileOrBlob) {
  try {
    // embed() handles File/Blob (data URL) and string (URL/data URL) sources
    const scores = await match(fileOrBlob);
    if (!scores || scores.length === 0) {
      resultsList.innerHTML = '<div class="empty">No match found</div>';
      return;
    }
    resultsTitle.textContent = 'Top matches';
    resultsList.innerHTML = scores.map(({ i, s }) => {
      const m = meta[i] || {};
      const img = m.image ? m.image : '';
      const cls = s > 0.85 ? '' : s > 0.7 ? 'silver' : 'bronze';
      return `
        <div class="match">
          ${img ? `<img src="${img}" alt="" loading="lazy">` : `<div style="width:48px;height:68px;background:var(--bg-2);border-radius:6px"></div>`}
          <div class="info">
            <div class="name">${escapeHTML(m.name || cardIds[i] || '?')}</div>
            <div class="meta">${[m.set, m.number, m.rarity].filter(Boolean).join(' · ') || '—'}</div>
          </div>
          <div class="score ${cls}">${(s * 100).toFixed(1)}%</div>
        </div>`;
    }).join('');
  } catch (e) {
    resultsList.innerHTML = `<div class="err">Error: ${e.message}</div>`;
  }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function init() {
  await loadIndex();
  await loadModel();
  await startCamera();
}

$('flip-btn').addEventListener('click', flip);
$('upload-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  busy = true; captureBtn.disabled = true;
  resultsList.innerHTML = '<div class="empty">Matching…</div>';
  await runMatch(file);
  busy = false; captureBtn.disabled = false;
});
$('capture-btn').addEventListener('click', capture);
init();
</script>
</body>
</html>
