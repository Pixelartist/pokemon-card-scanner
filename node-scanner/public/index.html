<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16213e">
<title>Local Scanner — Pokémon Cards</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-2: #161b22;
    --card: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #f78166;
    --green: #3fb950;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex; flex-direction: column; min-height: 100vh;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }

  .stage {
    flex: 1; width: 100%; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; position: relative; min-height: 0;
  }
  #camera {
  width: 100%;
  display: block;
  background: #000;
}
#camera-overlay {
  position: absolute;
  top: 50%; left: 50%;
  width: 63%;
  aspect-ratio: 63/88;
  transform: translate(-50%, -50%);
  border: 2px solid var(--accent);
  border-radius: 12px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.3) inset;
  pointer-events: none;
  z-index: 10;
}
#camera-overlay::before {
  content: "";
  position: absolute;
  top: -10px; left: -10px; right: -10px; bottom: -10px;
  border: 1px dashed var(--accent);
  border-radius: 16px;
}
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; pointer-events: none;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
  }
  .topbar button {
    background: rgba(255,255,255,0.12); color: var(--text); border: none;
    border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; cursor: pointer;
  }
  .topbar button:hover { background: rgba(255,255,255,0.2); }
  .version-badge {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
    padding: 3px 10px; border-radius: 20px; border: 1px solid;
    background: rgba(0,0,0,0.4);
  }
  .version-badge.local { color: var(--accent); border-color: rgba(88,166,255,0.5); }
  .version-badge.cloud { color: var(--accent-2); border-color: rgba(247,129,102,0.5); }
  .frame {
    border: 2px solid rgba(88,166,255,0.6); border-radius: 14px;
    margin: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.55);
  }
  .status {
    text-align: center; padding: 10px 12px; font-size: 0.8rem;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
  }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; background: var(--muted); }
  .status .dot.on { background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .controls { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 14px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: filter 0.15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.ghost { background: var(--card); border: 1px solid var(--border); }
  .btn.ghost:hover { background: #2d333b; }

  .progress {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    margin-top: 12px; display: none;
  }
  .progress > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
  .progress.show { display: block; }

  .results {
    margin-top: 16px; width: 100%;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .results h2 { font-size: 0.8rem; margin: 0; padding: 10px 14px; color: var(--muted);
    background: var(--card); border-bottom: 1px solid var(--border); }
  .results-inner { padding: 12px; max-height: 45vh; overflow-y: auto; }
  .match { display: flex; align-items: center; gap: 10px; padding: 8px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 6px; cursor: pointer; transition: border-color 0.15s; }
  .match:hover { border-color: var(--accent); }
  .match img { width: 40px; height: 56px; object-fit: contain; border-radius: 6px; background: var(--bg-2); }
  .match .info { flex: 1; min-width: 0; }
  .match .name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match .meta { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
  .match .score { font-size: 0.75rem; font-weight: 600; }
  .match .score.silver { color: #c0c0c0; }
  .match .score.bronze { color: #cd7f32; }
  .empty { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 24px 0; }
  .err { color: var(--accent-2); font-size: 0.75rem; text-align: center; margin-top: 12px; }

  .queue-panel {
    margin-top: 10px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .queue-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--border);
    font-size: 0.8rem; font-weight: 600;
  }
  .queue-count {
    background: var(--accent); color: #fff; border-radius: 20px;
    padding: 1px 9px; font-size: 0.7rem; font-weight: 700;
  }
  .queue-count.zero { background: var(--muted); }
  .queue-list { max-height: 220px; overflow-y: auto; padding: 8px; }
  .queue-item {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 6px;
  }
  .queue-item img { width: 36px; height: 50px; object-fit: contain; border-radius: 6px; background: var(--bg-2); }
  .queue-item .qi-info { flex: 1; min-width: 0; }
  .queue-item .qi-name { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-item .qi-meta { font-size: 0.68rem; color: var(--muted); }
  .queue-item .qi-actions { display: flex; gap: 4px; }
  .queue-item .qi-actions button {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; font-size: 0.68rem; cursor: pointer;
  }
  .queue-item .qi-actions button:hover { border-color: var(--accent); }
  .queue-item .qi-actions button.keep { border-color: var(--green); color: var(--green); }
  .queue-item .qi-actions button.discard { border-color: var(--accent-2); color: var(--accent-2); }
  .queue-item .qi-status { font-size: 0.65rem; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
  <h1>Local Scanner</h1>
  <p class="subtitle">Runs entirely in your browser — no server, no upload</p>

  <div class="stage">
    <video id="camera" autoplay playsinline muted></video>
    <div id="camera-overlay"></div>
    <div class="overlay">
      <div class="topbar">
        <button id="flip-btn">↻ Flip</button>
        <button id="upload-btn">📷 Upload</button>
        <span class="version-badge" id="version-badge">LOCAL</span>
      </div>
      <div class="frame"></div>
      <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">Initialising…</span></div>
    </div>
  </div>

  <div class="progress" id="progress"><div></div></div>

  <div class="controls">
    <button class="btn" id="capture-btn" disabled>Capture</button>
    <button class="btn" id="auto-scan-btn">▶ Auto-Scan: OFF</button>
  </div>

  <div class="results">
    <h2 id="results-title">Top matches</h2>
    <div class="results-inner" id="results-list"></div>
  </div>

  <div class="queue-panel" id="review-queue"></div>

  <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">
<script src="./review-queue.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script type="module" src="./scanner-main.js"></script>
</body>
</html>
