<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electric Border Test - 1:1 Demo</title>
<style>
:root {
  --electric-border-color: #FFD700;
}
.card-container {
  position: relative;
  width: 300px;
  height: 400px;
  margin: 100px auto;
}
.inner-container {
  position: relative;
  width: 100%;
  height: 100%;
}
.border-outer {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  filter: url(#turbulent-displace);
  background: linear-gradient(45deg, var(--electric-border-color), #FFA500);
  padding: 2px;
}
.main-card {
  width: 100%;
  height: 100%;
  background: #1a1a1a;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}
.glow-layer-1, .glow-layer-2 {
  position: absolute;
  inset: -10px;
  border-radius: 24px;
  background: var(--electric-border-color);
  filter: blur(20px);
  opacity: 0.5;
  animation: glow-pulse 2s ease-in-out infinite;
}
.glow-layer-2 {
  filter: blur(40px);
  opacity: 0.3;
  animation-delay: -1s;
}
@keyframes glow-pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="turbulent-displace" colorInterpolationFilters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" seed="1" result="noise1">
        <animate attributeName="baseFrequency" values="0.01;0.03;0.01" dur="2s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise1" scale="30" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
  </defs>
</svg>

<div class="card-container">
  <div class="inner-container">
    <div class="border-outer">
      <div class="main-card">
        <h2>⚡ Electric Border</h2>
        <p>1:1 Demo Test</p>
      </div>
    </div>
    <div class="glow-layer-1"></div>
    <div class="glow-layer-2"></div>
  </div>
</div>
</body>
</html>
